<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calora — Email confirmed</title>
<style>
:root{--bg:#F5F6F7;--card:#FFFFFF;--text:#1F2937;--muted:#6B7280;--green:#22C55E}
@media (prefers-color-scheme:dark){:root{--bg:#0B1120;--card:#111827;--text:#F9FAFB;--muted:#9CA3AF}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);padding:24px;box-sizing:border-box}
.card{background:var(--card);border-radius:24px;padding:40px 28px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tick{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;line-height:72px;margin:0 auto 20px}
h1{font-size:26px;margin:0 0 10px}p{color:var(--muted);line-height:1.6;margin:0 0 8px}
</style></head><body><div class="card">
<div class="tick">✓</div>
<h1>Email confirmed</h1>
<p>Your Calora account is ready.</p>
<p>Open the Calora app on your iPhone and log in with your email and password.</p>
</div></body></html>
